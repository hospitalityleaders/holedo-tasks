version: "3.8"

services:
  tasks-migrate:
    image: ghcr.io/hospitalityleaders/holedo-tasks-migrate:edge
    pull_policy: always
    container_name: holedo-tasks-migrate
    environment:
      # UpCloud Managed PostgreSQL
      DB_HOST: "holedo-postgresql-production-gympboioheqo.db.upclouddatabases.com"
      DB_PORT: "11569"
      DB_NAME: "holedo_tasks"
      DB_USER: "holedo_tasks"
      DB_PASSWORD: "______________________"
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
    networks:
      - npm_proxy
    restart: "no"

  tasks-web:
    image: ghcr.io/hospitalityleaders/holedo-tasks:edge
    pull_policy: always
    container_name: holedo-tasks
    init: true
    environment:
      # Application
      NODE_ENV: "production"
      PORT: "3000"
      NEXT_PUBLIC_BASE_URL: "https://tasks.holedo.com"
      BETTER_AUTH_TRUSTED_ORIGINS: "https://tasks.holedo.com"
      BETTER_AUTH_SECRET: "______________________________"

      # UpCloud Managed PostgreSQL
      DB_HOST: "holedo-postgresql-production-gympboioheqo.db.upclouddatabases.com"
      DB_PORT: "11569"
      DB_NAME: "holedo_tasks"
      DB_USER: "holedo_tasks"
      DB_PASSWORD: "______________________"
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"

      # Demo access: a user can create an account with email and password.
      NEXT_PUBLIC_ALLOW_CREDENTIALS: "true"
      NEXT_PUBLIC_DISABLE_SIGN_UP: "false"
      NEXT_PUBLIC_DISABLE_EMAIL: "true"
      NEXT_PUBLIC_WHITE_LABEL_HIDE_POWERED_BY: "true"

      # Runtime presentation settings at /admin.
      ADMIN_TOKEN: "______________________________"
      ADMIN_SESSION_SECRET: "______________________________"

      # Holedo identity: Tanish can populate these for Keycloak or another
      # standards-compliant OIDC provider without changing the application.
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      OIDC_DISCOVERY_URL: ""

      LOG_LEVEL: info
      REDIS_URL: ""

      # UpCloud Managed Object Storage (user: holedo_tasks)
      S3_ENDPOINT: "https://gdrv6.upcloudobjects.com"
      S3_REGION: "______________________"
      S3_ACCESS_KEY_ID: "A________________________"
      S3_SECRET_ACCESS_KEY: "____________________________"
      S3_FORCE_PATH_STYLE: "false"
      NEXT_PUBLIC_STORAGE_URL: "https://gdrv6.upcloudobjects.com"
      NEXT_PUBLIC_STORAGE_DOMAIN: "gdrv6.upcloudobjects.com"
      NEXT_PUBLIC_AVATAR_BUCKET_NAME: "holedo-tasks-avatars"
      NEXT_PUBLIC_ATTACHMENTS_BUCKET_NAME: "holedo-tasks-attachments"
      NEXT_PUBLIC_USE_VIRTUAL_HOSTED_URLS: "true"
    depends_on:
      tasks-migrate:
        condition: service_completed_successfully
    networks:
      npm_proxy:
        aliases:
          - holedo-tasks
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    restart: unless-stopped

networks:
  npm_proxy:
    external: true
    name: npm_proxy
